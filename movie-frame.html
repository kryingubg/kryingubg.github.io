<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#000}
</style>
</head>
<body>
<iframe id="p" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>
<script>(function(){
var raw="";
try{raw=new URLSearchParams(location.search).get("u")||""}catch(e){}
try{raw=decodeURIComponent(raw)}catch(e){}
if(!/^https:\/\//i.test(raw))return;;
document.getElementById("p").src=raw;
window.open=function(){return null};;
window.alert=function(){};
window.addEventListener("blur",function(){
setTimeout(function(){try{window.focus()}catch(e){}},0);
},true);
setInterval(function(){try{window.focus()}catch(e){}},500);
})();
</script>
</body>
</html>
