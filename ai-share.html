<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>krying · screen</title>
  <link rel="icon" href="assets/kobran-logo.webp" />
  <style>
    :root {
      --bg: #07090c;
      --panel: rgba(10, 14, 18, 0.94);
      --line: rgba(255, 255, 255, 0.12);
      --warm: #e8a070;
      --text: #f3f1ee;
      --muted: rgba(230, 225, 218, 0.55);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      overflow: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(18px) saturate(0.75) brightness(0.35);
      transform: scale(1.1);
    }
    .fog {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 20%, rgba(232, 160, 112, 0.12), transparent 55%),
        linear-gradient(180deg, rgba(5, 7, 10, 0.35), rgba(5, 7, 10, 0.88));
    }
    .wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      padding: 0.85rem 0.85rem 0.75rem;
      gap: 0.65rem;
    }
    .top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.65rem;
      align-items: center;
      flex-shrink: 0;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    .mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      object-fit: cover;
    }
    .top strong {
      display: block;
      font-size: 0.9rem;
      line-height: 1.15;
    }
    .top span {
      display: block;
      margin-top: 0.1rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .top span:empty { display: none; }
    .stop, .solve, .go, .model {
      font: inherit;
      cursor: pointer;
    }
    .stop, .model {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 0.74rem;
      font-weight: 700;
    }
    .model {
      max-width: 9.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(8, 10, 14, 0.72);
    }
    .empty {
      margin: auto;
      text-align: center;
      max-width: 28ch;
      padding: 1rem 0.5rem;
    }
    .badge {
      width: 58px;
      height: 58px;
      margin: 0 auto 0.7rem;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #f6d7bf;
      background:
        radial-gradient(circle at 30% 25%, rgba(232, 160, 112, 0.35), transparent 55%),
        rgba(232, 160, 112, 0.12);
      border: 1px solid rgba(232, 160, 112, 0.28);
    }
    .empty h1 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .empty p {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .bubble {
      max-width: 94%;
      padding: 0.7rem 0.8rem;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble--user {
      align-self: flex-end;
      background: rgba(232, 160, 112, 0.18);
      border: 1px solid rgba(232, 160, 112, 0.28);
      color: #fff4ea;
    }
    .bubble--ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(245, 242, 238, 0.95);
    }
    .bubble--wait {
      opacity: 0.72;
      font-style: italic;
    }
    .foot {
      display: grid;
      gap: 0.55rem;
      flex-shrink: 0;
    }
    .solve {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 0.95rem 1rem;
      background: linear-gradient(135deg, #f0b58a, #d9895a);
      color: #1a0e08;
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1;
    }
    .solve:hover { filter: brightness(1.05); }
    .solve:disabled, .go:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .ask {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.4rem 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
    }
    .ask input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.92rem;
      padding: 0.6rem 0;
    }
    .ask input::placeholder { color: rgba(230, 225, 218, 0.4); }
    .go {
      width: 2.45rem;
      height: 2.45rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: rgba(232, 160, 112, 0.22);
      color: #ffe8d4;
      flex-shrink: 0;
    }
    .go:hover { background: rgba(232, 160, 112, 0.34); }
    .wait {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2rem 1rem;
    }
    .drag {
      flex-shrink: 0;
      height: 0.55rem;
      margin: -0.15rem 0 0.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      cursor: grab;
      align-self: center;
      width: 3.2rem;
    }
    .drag:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <video id="share-video" autoplay playsinline muted></video>
    <div class="fog"></div>
  </div>
  <div class="wrap">
    <div class="drag" id="share-drag" title="drag"></div>
    <div class="top">
      <img class="mark" src="assets/kobran-logo.webp" alt="" width="32" height="32" />
      <div>
        <strong id="share-host">krying screen</strong>
        <span id="share-label"></span>
      </div>
      <div style="display:flex;gap:0.35rem;align-items:center">
        <button type="button" class="model" id="share-model" title="tap to switch model">auto</button>
        <button type="button" class="stop" id="share-stop">Stop</button>
      </div>
    </div>
    <div class="chat" id="share-chat">
      <div class="wait" id="share-wait">grabbing your share…</div>
      <div class="empty" id="share-empty" hidden>
        <div class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><circle cx="12" cy="10" r="2.2"/></svg>
        </div>
        <h1>Ask about the shared screen</h1>
        <p>Every question takes a fresh frame. Chat stays here so you can see replies while you move around.</p>
      </div>
    </div>
    <div class="foot">
      <button type="button" class="solve" id="share-solve" disabled>Read this screen</button>
      <form class="ask" id="share-form">
        <input type="text" id="share-input" placeholder="Ask about what you're sharing…" autocomplete="off" spellcheck="false" />
        <button type="submit" class="go" id="share-go" aria-label="Ask" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h13.2M13.2 6.8L19.5 12l-6.3 5.2"/></svg>
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="ai-data.js?v=3"></script>
  <script src="ai-share.js?v=9"></script>
</body>
</html>
